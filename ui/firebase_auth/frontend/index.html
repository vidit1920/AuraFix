<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in</title>
    <style>
      :root {
        --text: #e6e8ee;
        --muted: #9aa0ac;
        --btn-bg: #1f2430;
        --btn-bg-hover: #262c3a;
        --btn-border: #343b49;
        --btn-border-hover: #46506280;
        --accent: #5b8def;
        --error: #e59a9a;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: transparent; }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: var(--text);
      }
      .wrap { display: flex; flex-direction: column; gap: 11px; width: 100%; }
      button.sso {
        display: flex; align-items: center; justify-content: center; gap: 10px;
        width: 100%; height: 46px; padding: 0 16px;
        font-size: 0.94rem; font-weight: 500; font-family: inherit; color: var(--text);
        background: var(--btn-bg); border: 1px solid var(--btn-border); border-radius: 8px;
        cursor: pointer; transition: background-color .12s ease, border-color .12s ease;
      }
      button.sso:hover:not(:disabled) { background: var(--btn-bg-hover); border-color: var(--btn-border-hover); }
      button.sso:active:not(:disabled) { background: #1b2029; }
      button.sso:disabled { opacity: 0.55; cursor: default; }
      button.sso svg { width: 18px; height: 18px; flex: 0 0 18px; }
      .msg { font-size: 0.84rem; color: var(--muted); min-height: 1.1em; text-align: center; margin-top: 2px; }
      .msg.error { color: var(--error); }
      .spin {
        width: 15px; height: 15px; border: 2px solid currentColor; border-right-color: transparent;
        border-radius: 50%; display: inline-block; vertical-align: -2px; margin-right: 7px;
        animation: af-rot .7s linear infinite;
      }
      @keyframes af-rot { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <button class="sso" id="btn-google" type="button" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21.35 11.1H12v3.2h5.35c-.23 1.4-1.6 4.1-5.35 4.1-3.22 0-5.85-2.67-5.85-5.95S8.78 6.5 12 6.5c1.83 0 3.06.78 3.76 1.45l2.56-2.47C16.76 3.9 14.6 3 12 3 6.98 3 2.9 7.03 2.9 12s4.08 9 9.1 9c5.25 0 8.73-3.69 8.73-8.89 0-.6-.06-1.05-.15-1.51z"/></svg>
        <span>Continue with Google</span>
      </button>
      <button class="sso" id="btn-github" type="button" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2C6.48 2 2 6.58 2 12.25c0 4.53 2.87 8.37 6.84 9.73.5.1.68-.22.68-.49l-.01-1.9c-2.78.62-3.37-1.21-3.37-1.21-.45-1.18-1.11-1.49-1.11-1.49-.91-.64.07-.63.07-.63 1 .07 1.53 1.06 1.53 1.06.9 1.57 2.35 1.12 2.92.86.09-.67.35-1.12.63-1.38-2.22-.26-4.56-1.14-4.56-5.07 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.72 0 0 .84-.28 2.75 1.05A9.3 9.3 0 0 1 12 6.84c.85 0 1.71.12 2.51.34 1.91-1.33 2.75-1.05 2.75-1.05.55 1.42.2 2.46.1 2.72.64.72 1.03 1.63 1.03 2.75 0 3.94-2.34 4.81-4.57 5.06.36.32.68.94.68 1.9l-.01 2.82c0 .27.18.59.69.49A10.03 10.03 0 0 0 22 12.25C22 6.58 17.52 2 12 2z"/></svg>
        <span>Continue with GitHub</span>
      </button>
      <div class="msg" id="msg"></div>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
