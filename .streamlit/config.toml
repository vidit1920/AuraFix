# AuraFix theme + runtime config.
#
# Theme: warm charcoal, one amber accent. Success stays green and warnings
# orange so they never read as the accent. Colours meet WCAG AA contrast on
# both the page and card backgrounds. Fonts are the system UI stack: the
# app's CSP only allows self-hosted fonts.
[theme]
base = "dark"
primaryColor = "#F59E0B"          # amber (primary buttons get dark text in CSS)
backgroundColor = "#151311"       # warm charcoal
secondaryBackgroundColor = "#1E1B18"
textColor = "#E7E5E4"
borderColor = "#3A332C"
linkColor = "#FBBF24"
showWidgetBorder = true
baseRadius = "0.5rem"
font = "sans-serif"

[server]
headless = true
enableCORS = true                 # reject cross-origin requests
enableXsrfProtection = true       # CSRF protection on form posts
enableStaticServing = false       # do not serve arbitrary files from the app dir
maxUploadSize = 5                 # MB; the app takes no large uploads
fileWatcherType = "none"          # no hot-reload in production
runOnSave = false

[browser]
gatherUsageStats = false

[client]
showErrorDetails = "none"         # debug OFF: never show tracebacks to users
toolbarMode = "minimal"

[logger]
level = "info"
